services:

    web:
        user: ${UID}:${GID} # Run processes as host user (ensures host user owns files created by container)
        build:
            context: .
            dockerfile: docker/web/Dockerfile
            args:
                - APP_PHP_VERSION=${APP_PHP_VERSION}
        container_name: ${APP_NAME}-web
        ports:
            - ${APP_PORT}:80
            - ${APP_PORT_SSL}:443
        working_dir: /var/www/html
        environment:
            - TZ=${APP_TZ}
            - UID=${UID}
            - GID=${GID}
        volumes:
            - ./:/var/www/html
            - ./docker/web/apache2/sites-available:/etc/apache2/sites-available
            - ${HOST_DEV_CERTS_PATH}:/etc/apache2/ssl
            - ./docker/web/php/php.ini:/usr/local/etc/php/conf.d/extra-php-config.ini
            - ./docker/web/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini

    workspace:
        depends_on:
            - db
        user: ${UID}:${GID} # Run processes as host user (ensures host user owns files created by container)
        build:
            context: .
            dockerfile: docker/workspace/Dockerfile
            args:
                - APP_PHP_VERSION=${APP_PHP_VERSION}
        container_name: ${APP_NAME}-workspace
        hostname: ${APP_NAME}-workspace
        working_dir: /var/www/html
        environment:
            - TZ=${APP_TZ}
            - UID=${UID}
            - GID=${GID}
            - DB_HOSTNAME=${DB_HOSTNAME}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - INSTALL_STARTING_POINT=${INSTALL_STARTING_POINT}
            - INSTALL_SITE_NAME=${INSTALL_SITE_NAME}
            - INSTALL_LANGUAGE=${INSTALL_LANGUAGE}
            - INSTALL_SITE_LOCALE=${INSTALL_SITE_LOCALE}
            - APP_TZ=${APP_TZ}
            - INSTALL_ADMIN_EMAIL=${INSTALL_ADMIN_EMAIL}
            - INSTALL_ADMIN_PASSWORD=${INSTALL_ADMIN_PASSWORD}
            - INSTALL_SCRIPT_EXECUTED=${INSTALL_SCRIPT_EXECUTED:-} # @see install.sh
            - EMPTY_PROJECT=${EMPTY_PROJECT:-} # @see install.sh
            - READY_MSG=${READY_MSG:-} # @see install.sh
        volumes:
            - ./:/var/www/html
        stdin_open: true # Equivalent of docker run -i — it keeps the container’s STDIN open even if no one is attached
        tty: true # Equivalent of docker run -t — it allocates a pseudo‑TTY for the container

    db:
        image: mariadb:10.5.9
        container_name: ${APP_NAME}-db
        hostname: ${DB_HOSTNAME}
        restart: always
        ports:
            - ${APP_DB_PORT}:3306
        environment:
            - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
            - MYSQL_DATABASE=${DB_DATABASE}
            - TZ=${APP_TZ}
        volumes:
            - ./db/mariadb:/var/lib/mysql
            - ./docker/db/mariadb/my.cnf:/etc/mysql/conf.d/my.cnf
            #- ./logs/mysql:/var/log/mysql # See "docker/db/mariadb/my.cnf"

    pma:
        depends_on:
            - db
        image: phpmyadmin:latest
        container_name: ${APP_NAME}-pma
        ports:
            - ${APP_PMA_PORT}:80
        environment:
            - PMA_ARBITRARY=1
            - PMA_HOST=db
        volumes:
            - ./docker/pma/config.php:/etc/phpmyadmin/config.user.inc.php
            - ./docker/pma/themes/boodark:/var/www/html/themes/boodark

    mailpit:
        image: axllent/mailpit:latest
        container_name: ${APP_NAME}-mailpit
        restart: always
        ports:
            - ${MAIL_SERVER_HTTP_PORT}:8025
            - ${MAIL_SERVER_SMTP_PORT}:1025
